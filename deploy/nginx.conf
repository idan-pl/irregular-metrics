server {
    listen 80;
    server_name irregular-services.duckdns.org;

    # Let's Encrypt challenge only
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Reject everything else
    location / {
        return 444;
    }
}

server {
    listen 8433 ssl http2;
    server_name irregular-services.duckdns.org;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/irregular-services.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irregular-services.duckdns.org/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend static files
    root /var/www/meh-trics/frontend/dist;
    index index.html;

    # API proxy to FastAPI backend
    location /metrics {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # SPA fallback - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
